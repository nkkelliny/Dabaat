<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Dabaat - Social Debating Platform" />
    <meta name="author" content="" />
    <title>Dabaat - Settings</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet" />
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-5">
            <a class="navbar-brand" href="#!"><img style="width: 20%;" src="./assets/dabaat_logo.png" alt="Dabaat Logo"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/home">Debates</a></li>
                    <li class="nav-item"><a class="nav-link" href="#community">Community</a></li>
                    <li class="nav-item"><a class="nav-link" target="_blank" href="/#contact">Contact</a></li>
                    <!-- User Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <span id="username">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="/profile">Profile</a></li>
                            <li><a class="dropdown-item" href="/settings">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Settings Section -->
    <section class="py-5" id="settings">
        <div class="container px-5">
            <div class="text-center mb-4">
                <h1 class="fw-bolder">Account Settings</h1>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-lg mb-5">
                        <div class="card-body">
                            <h3 class="mb-4">Edit Account Information</h3>
                            <form id="account-form">
                                <!-- Email -->
                                <div class="form-group mb-3">
                                    <label for="email">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                                </div>
                                <!-- Password -->
                                <div class="form-group mb-3">
                                    <label for="password">Password</label>
                                    <input type="password" class="form-control" id="password" placeholder="Enter a new password (optional)">
                                </div>
                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-warning w-100">Update Account</button>
                            </form>
                        </div>
                    </div>

                    <div class="card shadow-lg">
                        <div class="card-body">
                            <h3 class="mb-4">Multi-Factor Authentication (MFA)</h3>
                            <div id="mfa-section">
                                <div class="form-check form-switch mb-4">
                                    <input class="form-check-input" type="checkbox" id="mfa-enabled" />
                                    <label class="form-check-label" for="mfa-enabled">Enable Multi-Factor Authentication</label>
                                </div>
                                <div id="mfa-setup" style="display: none;">
                                    <p>Scan the QR code with your authenticator app and enter the code to verify:</p>
                                    <img id="mfa-qr-code" src="" alt="MFA QR Code" class="mb-3" />
                                    <input type="text" class="form-control mb-3" id="mfa-code" placeholder="Enter the code from your app" />
                                    <button class="btn btn-success" id="verify-mfa">Verify MFA</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-5 bg-light">
        <div class="container px-5">
            <p class="m-0 text-center">&copy; Dabaat 2024</p>
        </div>
    </footer>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>

    <!-- Client-Side Script -->
    <script src="js/settings.js"></script>
</body>
</html>
