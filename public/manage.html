<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Dabaat - Social Debating Platform" />
    <meta name="author" content="" />
    <title>Dabaat - Manage Debates</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet" />
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-5">
            <a class="navbar-brand" href="#!"><img style="width: 20%;" src="./assets/dabaat_logo.png" alt="Dabaat Logo"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="home.html">Debates</a></li>
                    <li class="nav-item"><a class="nav-link" href="#community">Community</a></li>
                    <li class="nav-item"><a class="nav-link" target="_blank" href="index.html#contact">Contact</a></li>
                    <!-- User Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <span id="username">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                            <li><a class="dropdown-item" href="settings.html">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="index.html">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Manage Debates Section -->
    <section class="py-5" id="manage-debates">
        <div class="container px-5">
            <div class="text-center mb-4">
                <h1 class="fw-bolder">Manage Your Debates</h1>
                <p class="text-muted">Create, edit, or delete debates you've started.</p>
            </div>
            <div class="mb-4 text-end">
                <button class="btn btn-warning" id="create-debate-button">Create New Debate</button>
            </div>
            <div id="debates-container" class="row"></div>
        </div>
    </section>

    <!-- Modal for Creating/Editing Debate -->
    <div class="modal fade" id="debateModal" tabindex="-1" aria-labelledby="debateModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="debateModalLabel">Create Debate</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="debate-form">
                        <div class="form-group mb-3">
                            <label for="debate-title">Debate Title</label>
                            <input type="text" class="form-control" id="debate-title" placeholder="Enter debate title" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="debate-description">Debate Description</label>
                            <textarea class="form-control" id="debate-description" rows="4" placeholder="Enter debate description" required></textarea>
                        </div>
                        <input type="hidden" id="debate-id">
                        <button type="submit" class="btn btn-warning w-100">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-5 bg-light">
        <div class="container px-5">
            <p class="m-0 text-center">&copy; Dabaat 2024</p>
        </div>
    </footer>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>

    <!-- Client-Side Script -->
    <script src="js/manage.js"></script>

</body>
</html>
