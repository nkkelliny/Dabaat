<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Dabaat - Social Debating Platform for exchanging ideas" />
    <meta name="author" content="" />
    <title>Dabaat - Debate</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet" />
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-5">
            <a class="navbar-brand" href="#!"><img style="width: 20%;" src="./assets/dabaat_logo.png" alt="Dabaat Logo"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#debates">Debates</a></li>
                    <li class="nav-item"><a class="nav-link" href="#community">Community</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                    <!-- User Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <span id="username">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="#profile">Profile</a></li>
                            <li><a class="dropdown-item" href="#settings">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="logout.html">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Debate Section -->
    <section class="py-5" id="debate">
        <div class="container px-5">
            <div class="text-center mb-4">
                <h1 class="fw-bolder" id="debate-title">Loading Debate...</h1>
                <p class="text-muted" id="debate-description">Please wait while we load the debate details.</p>
            </div>
            <div class="text-center mb-4">
                <button class="btn btn-success me-2" id="vote-pro"><i class="bi bi-hand-thumbs-up"></i> Vote Pro</button>
                <button class="btn btn-danger" id="vote-con"><i class="bi bi-hand-thumbs-down"></i> Vote Con</button>
            </div>
        </div>
    </section>

    <!-- Comments Section -->
    <section class="py-5 bg-light" id="comments">
        <div class="container px-5">
            <div class="mb-4">
                <h2 class="fw-bolder">Comments</h2>
                <div id="comments-container" class="mt-3">
                    <p class="text-muted">No comments yet. Be the first to comment!</p>
                </div>
            </div>
            <div class="mt-4">
                <textarea class="form-control mb-3" id="new-comment" placeholder="Write your comment..." rows="3"></textarea>
                <button class="btn btn-warning" id="submit-comment">Submit Comment</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-5 bg-light">
        <div class="container px-5">
            <p class="m-0 text-center">&copy; Dabaat 2024</p>
        </div>
    </footer>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>

    <!-- Client-Side Script -->
    <script src="js/debate.js"></script>
</body>
</html>
